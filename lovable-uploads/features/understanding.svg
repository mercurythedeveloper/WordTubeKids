  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#bgGrad2)"/>
  <!-- Picture card 1 (behind) -->
  <rect x="12" y="20" width="26" height="34" rx="4" fill="#fff" stroke="#D4D4D8" stroke-width="1.5" transform="rotate(-6,25,37)"/>
  <circle cx="25" cy="33" r="6" fill="#FDE68A"/>
  <path d="M22 33 L25 29 L28 33" fill="none" stroke="#F59E0B" stroke-width="1.2"/>

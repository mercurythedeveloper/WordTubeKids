  <line x1="70" y1="14" x2="72" y2="14" stroke="#FBBF24" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="9" x2="70" y2="7" stroke="#FBBF24" stroke-width="1" stroke-linecap="round"/>

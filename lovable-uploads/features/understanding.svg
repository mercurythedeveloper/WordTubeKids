  <circle cx="47" cy="32" r="9" fill="#FED7AA"/>
  <!-- Cat ears -->
  <path d="M40 24 L42 28 L38 28Z" fill="#FB923C"/>
  <path d="M54 24 L52 28 L56 28Z" fill="#FB923C"/>

  <path d="M47 35 Q50 37 51 36" stroke="#1E293B" stroke-width="0.7" fill="none"/>
  <!-- Cat whiskers -->
  <line x1="37" y1="33" x2="42" y2="34" stroke="#9CA3AF" stroke-width="0.6"/>
  <line x1="37" y1="36" x2="42" y2="35" stroke="#9CA3AF" stroke-width="0.6"/>
  <line x1="52" y1="34" x2="57" y2="33" stroke="#9CA3AF" stroke-width="0.6"/>
  <line x1="52" y1="35" x2="57" y2="36" stroke="#9CA3AF" stroke-width="0.6"/>
  <!-- Word label under cat -->
  <text x="47" y="48" text-anchor="middle" fill="#7C3AED" font-size="7" font-weight="600" font-family="system-ui, sans-serif">Cat</text>

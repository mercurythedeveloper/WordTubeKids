<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#bgGrad3)"/>
  <!-- Big teddy bear (left) -->
  <!-- Body -->
  <ellipse cx="24" cy="50" rx="12" ry="14" fill="#D4A574"/>
  <!-- Head -->
  <circle cx="24" cy="32" r="10" fill="#E8C9A0"/>
  <!-- Ears -->
  <circle cx="16" cy="24" r="4" fill="#E8C9A0"/>
  <circle cx="16" cy="24" r="2.5" fill="#D4A574"/>
  <circle cx="32" cy="24" r="4" fill="#E8C9A0"/>
  <circle cx="32" cy="24" r="2.5" fill="#D4A574"/>
  <!-- Face -->
  <circle cx="20" cy="31" r="1.5" fill="#1E293B"/>
  <circle cx="28" cy="31" r="1.5" fill="#1E293B"/>
  <ellipse cx="24" cy="35" rx="2" ry="1.5" fill="#A16207"/>
  <!-- Belly -->
  <ellipse cx="24" cy="50" rx="7" ry="9" fill="#E8C9A0"/>
  <!-- Arms -->
  <ellipse cx="13" cy="46" rx="4" ry="6" fill="#D4A574" transform="rotate(15,13,46)"/>
  <ellipse cx="35" cy="46" rx="4" ry="6" fill="#D4A574" transform="rotate(-15,35,46)"/>
  <!-- "BIG" label -->
  <text x="24" y="70" text-anchor="middle" fill="#16A34A" font-size="8" font-weight="700" font-family="system-ui, sans-serif">BIG</text>

  <!-- Small teddy bear (right) -->
  <!-- Body -->
  <ellipse cx="60" cy="56" rx="7" ry="8" fill="#D4A574"/>
  <!-- Head -->
  <circle cx="60" cy="44" r="6" fill="#E8C9A0"/>
  <!-- Ears -->
  <circle cx="55" cy="39" r="2.5" fill="#E8C9A0"/>
  <circle cx="55" cy="39" r="1.5" fill="#D4A574"/>
  <circle cx="65" cy="39" r="2.5" fill="#E8C9A0"/>
  <circle cx="65" cy="39" r="1.5" fill="#D4A574"/>
  <!-- Face -->
  <circle cx="58" cy="43.5" r="1" fill="#1E293B"/>
  <circle cx="62" cy="43.5" r="1" fill="#1E293B"/>
  <ellipse cx="60" cy="46" rx="1.2" ry="1" fill="#A16207"/>
  <!-- Belly -->
  <ellipse cx="60" cy="56" rx="4" ry="5" fill="#E8C9A0"/>
  <!-- Arms -->
  <ellipse cx="54" cy="53" rx="2.5" ry="3.5" fill="#D4A574" transform="rotate(15,54,53)"/>
  <ellipse cx="66" cy="53" rx="2.5" ry="3.5" fill="#D4A574" transform="rotate(-15,66,53)"/>
  <!-- "small" label -->
  <text x="60" y="70" text-anchor="middle" fill="#16A34A" font-size="7" font-weight="600" font-family="system-ui, sans-serif">small</text>

  <!-- VS divider -->
  <text x="42" y="52" text-anchor="middle" fill="#86EFAC" font-size="10" font-weight="800" font-family="system-ui, sans-serif">vs</text>
</svg>

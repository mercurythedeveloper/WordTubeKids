<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#bgGrad)"/>
  <!-- Apple body -->
  <ellipse cx="36" cy="46" rx="16" ry="17" fill="#EF4444"/>
  <ellipse cx="36" cy="46" rx="16" ry="17" fill="#DC2626" opacity="0.3"/>
  <!-- Apple highlight -->
  <ellipse cx="30" cy="40" rx="5" ry="8" fill="#F87171" opacity="0.6"/>
  <!-- Apple stem -->
  <path d="M36 29 Q38 22 42 20" stroke="#78350F" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Apple leaf -->
  <path d="M38 24 Q46 20 48 26 Q42 28 38 24Z" fill="#22C55E"/>
  <path d="M38 24 Q44 24 48 26" stroke="#16A34A" stroke-width="0.8" fill="none"/>
  <!-- Label tag -->
  <rect x="48" y="12" width="26" height="16" rx="4" fill="#8B5CF6" opacity="0.95"/>
  <text x="61" y="23" text-anchor="middle" fill="#fff" font-size="9" font-weight="600" font-family="system-ui, sans-serif">Apple</text>
  <!-- Dashed line from tag to apple -->
  <line x1="48" y1="20" x2="44" y2="30" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#bgGrad4)"/>
  <!-- Speech bubble with question -->
  <rect x="8" y="8" width="44" height="28" rx="8" fill="#fff" stroke="#FBBF24" stroke-width="2"/>
  <polygon points="22,36 30,36 24,44" fill="#fff" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cover the inner stroke of bubble tail -->
  <line x1="22" y1="35" x2="30" y2="35" stroke="#fff" stroke-width="3"/>
  <!-- Question text -->
  <text x="30" y="20" text-anchor="middle" fill="#92400E" font-size="8" font-weight="600" font-family="system-ui, sans-serif">What is</text>
  <text x="30" y="30" text-anchor="middle" fill="#92400E" font-size="8" font-weight="600" font-family="system-ui, sans-serif">this? </text>

  <!-- Answer bubble (right) -->
  <rect x="42" y="38" width="32" height="22" rx="7" fill="#8B5CF6"/>
  <polygon points="50,60 44,66 56,60" fill="#8B5CF6"/>
  <!-- Dog face in answer bubble -->
  <circle cx="54" cy="47" r="5" fill="#FED7AA"/>
  <!-- Dog ears -->
  <ellipse cx="50" cy="43" rx="2.5" ry="3.5" fill="#D4A574" transform="rotate(-15,50,43)"/>
  <ellipse cx="58" cy="43" rx="2.5" ry="3.5" fill="#D4A574" transform="rotate(15,58,43)"/>
  <!-- Dog face -->
  <circle cx="52" cy="46.5" r="1" fill="#1E293B"/>
  <circle cx="56" cy="46.5" r="1" fill="#1E293B"/>
  <ellipse cx="54" cy="49" rx="1.5" ry="1" fill="#1E293B"/>
  <!-- Dog tongue -->
  <ellipse cx="54" cy="51" rx="1" ry="1.5" fill="#F472B6"/>
  <!-- "Dog!" text -->
  <text x="67" y="53" text-anchor="middle" fill="#fff" font-size="6" font-weight="700" font-family="system-ui, sans-serif">!</text>

  <!-- Small star decorations -->
  <circle cx="68" cy="14" r="2" fill="#FBBF24" opacity="0.6"/>
  <circle cx="62" cy="22" r="1.5" fill="#FBBF24" opacity="0.4"/>
  <circle cx="72" cy="28" r="1" fill="#FBBF24" opacity="0.5"/>
</svg>
